<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>Faezeh Rezayat</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            direction: rtl;
            background-color: #f5f5f5;
            padding: 40px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 40px;
        }
        .field-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .field-title {
            font-size: 18px;
            margin-bottom: 10px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 15px;
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 6px;
        }
        .copied-message {
            color: green;
            margin-top: 10px;
            display: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>Faezeh Rezayat</h1>

    <div class="field-container">
        <div class="field-title">کانفیگ فرگمنت مخصوص هیدیفای</div>
        <input type="text" id="text1" value="hiddify://import/https://0a3-hpxb-mdbeqksrbkj-63bpvvdleej.rkrzy.workers.dev/sub/fragment/WWA9%248N*ItOTi7Pv?app=hiddify-frag#%F0%9F%92%A6%20BPB%20Fragment" readonly>
        <button onclick="copyText('text1', 'msg1')">کپی کن</button>
        <div id="msg1" class="copied-message">کپی شد!</div>
    </div>

    <div class="field-container">
        <div class="field-title">کد پیگیری</div>
        <input type="text" id="text2" value="TRK-9987-ABCD" readonly>
        <button onclick="copyText('text2', 'msg2')">کپی کن</button>
        <div id="msg2" class="copied-message">کپی شد!</div>
    </div>

    <div class="field-container">
        <div class="field-title">لینک ورود</div>
        <input type="text" id="text3" value="https://example.com/login" readonly>
        <button onclick="copyText('text3', 'msg3')">کپی کن</button>
        <div id="msg3" class="copied-message">کپی شد!</div>
    </div>

    <script>
        function copyText(inputId, msgId) {
            const input = document.getElementById(inputId);
            input.select();
            input.setSelectionRange(0, 99999); // برای موبایل

            navigator.clipboard.writeText(input.value).then(() => {
                const msg = document.getElementById(msgId);
                msg.style.display = "block";
                setTimeout(() => {
                    msg.style.display = "none";
                }, 2000);
            });
        }
    </script>

</body>
</html>
