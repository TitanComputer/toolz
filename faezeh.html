<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Copy Text Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background-color: #f0f0f0;
        }
        #container {
            background-color: #fff;
            padding: 20px;
            max-width: 500px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        #copiedMessage {
            color: green;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="container">
        <input type="text" id="myText" value="متن دلخواه برای کپی کردن" readonly>
        <button onclick="copyText()">کپی کن</button>
        <div id="copiedMessage">متن کپی شد!</div>
    </div>

    <script>
        function copyText() {
            const textInput = document.getElementById("myText");
            textInput.select();
            textInput.setSelectionRange(0, 99999); // برای موبایل

            navigator.clipboard.writeText(textInput.value).then(() => {
                const message = document.getElementById("copiedMessage");
                message.style.display = "block";
                setTimeout(() => message.style.display = "none", 2000);
            });
        }
    </script>
</body>
</html>
