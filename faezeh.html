<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faezeh Rezayat</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            direction: rtl;
            background-color: #f5f5f5;
            padding: 20px;
            text-align: center;
        }
h1 {
    border: 3px dotted #e53935;
    padding: 15px 25px;
    border-radius: 10px;
    color: #b71c1c;
    background-color: #ffebee;
    text-align: center;
    display: inline-block;
    margin: 0 auto 40px;
}

        .field-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            max-width: 100%;
            margin: 0 auto;
        }
        .field-title {
            font-size: 18px;
            margin-bottom: 10px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            font-size: 15px;
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 6px;
        }
        .copied-message {
            color: green;
            margin-top: 10px;
            display: none;
            font-size: 14px;
        }
        .separator {
        height: 2px;
        background: linear-gradient(to right, #00c6ff, #0072ff);
        margin: 20px auto;
        max-width: 600px;
        border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>Faezeh Rezayat</h1>

    <div class="field-container">
        <div class="field-title">کانفیگ فرگمنت برای Hiddify</div>
        <input type="text" id="text1" value="hiddify://import/https://0a3-hpxb-mdbeqksrbkj-63bpvvdleej.rkrzy.workers.dev/sub/fragment/WWA9%248N*ItOTi7Pv?app=hiddify-frag#%F0%9F%92%A6%20BPB%20Fragment" readonly>
        <button onclick="copyText('text1', 'msg1')">کپی کن</button>
        <div id="msg1" class="copied-message">کپی شد!</div>
    </div>
<div class="separator"></div>
    <div class="field-container">
        <div class="field-title">کانفیگ فرگمنت برای v2rayNG ، MahsaNG و Streisand</div>
        <input type="text" id="text2" value="https://0a3-hpxb-mdbeqksrbkj-63bpvvdleej.rkrzy.workers.dev/sub/fragment/WWA9%248N*ItOTi7Pv#%F0%9F%92%A6%20BPB%20Fragment" readonly>
        <button onclick="copyText('text2', 'msg2')">کپی کن</button>
        <div id="msg2" class="copied-message">کپی شد!</div>
    </div>
<div class="separator"></div>
    <div class="field-container">
        <div class="field-title">کانفیگ نرمال برای همه برنامه ها</div>
        <input type="text" id="text3" value="https://0a3-hpxb-mdbeqksrbkj-63bpvvdleej.rkrzy.workers.dev/sub/normal/WWA9%248N*ItOTi7Pv#%F0%9F%92%A6%20BPB%20Normal" readonly>
        <button onclick="copyText('text3', 'msg3')">کپی کن</button>
        <div id="msg3" class="copied-message">کپی شد!</div>
    </div>
<div class="separator"></div>
    <div class="field-container">
        <div class="field-title">کانفیگ فول برای v2rayNG ، MahsaNG و Streisand</div>
        <input type="text" id="text2" value="https://0a3-hpxb-mdbeqksrbkj-63bpvvdleej.rkrzy.workers.dev/sub/full-normal/WWA9%248N*ItOTi7Pv?app=xray#%F0%9F%92%A6%20BPB%20Full%20Normal" readonly>
        <button onclick="copyText('text2', 'msg2')">کپی کن</button>
        <div id="msg2" class="copied-message">کپی شد!</div>
    </div>

    <script>
        function copyText(inputId, msgId) {
            const input = document.getElementById(inputId);
            input.select();
            input.setSelectionRange(0, 99999); // برای موبایل

            navigator.clipboard.writeText(input.value).then(() => {
                const msg = document.getElementById(msgId);
                msg.style.display = "block";
                setTimeout(() => {
                    msg.style.display = "none";
                }, 2000);
            });
        }
    </script>

</body>
</html>
